# PS-508 — the frozen customer-money tuple against REAL PostgreSQL 17.
#
# The pure guards build tuples as JavaScript object literals, which proves the RULE but not the
# ROUND TRIP. This job proves the persisted behaviour on the version production actually runs.
name: PS-508 PG17 proofs

on:
  # No paths filter, deliberately — same reasoning as the PS-488 M2 job. The behavioural
  # dependencies of this proof span billing.ts, the customer-money services, the classifier and
  # the snapshot contract; a list of "obvious" files would let a change to any of the others
  # bypass the proof entirely. On a money path, running it every time is cheaper than
  # maintaining that list.
  push:
    branches:
      - prepshipv4-stable
      - 'review/ps-508-**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ps-508-pg17-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pg17-proofs:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ps508
          POSTGRES_PASSWORD: ps508
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ps508"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      # Loopback service container only. No production database is reachable here and no deploy
      # secret is exposed to this job.
      PS508_PG17_ADMIN_URL: postgres://ps508:ps508@127.0.0.1:5432/postgres
      # The generator test imports billing.ts -> env.ts, which requires the Supabase vars at
      # parse time. Locally the repo's .env supplies them; CI has none. Inert dummies — nothing
      # in this job talks to Supabase, and the test overrides DATABASE_URL to the loopback
      # container before any src/ import.
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_ANON_KEY: offline-dummy
      SUPABASE_SERVICE_ROLE_KEY: offline-dummy
      SUPABASE_JWT_SECRET: offline-dummy

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --ignore-scripts

      # The proof itself refuses anything below 170000, so it cannot silently prove nothing.
      # This step fails earlier and louder if the service container is not the intended major.
      - name: Confirm PostgreSQL 17 is the server under test
        run: |
          set -euo pipefail
          version="$(npx tsx -e "
            (async () => {
              const postgres = (await import('postgres')).default;
              const sql = postgres(process.env.PS508_PG17_ADMIN_URL, { max: 1, prepare: false });
              const rows = await sql.unsafe(\"select current_setting('server_version_num') as v\");
              console.log(rows[0].v);
              await sql.end({ timeout: 5 });
            })();
          ")"
          echo "server_version_num=$version"
          case "$version" in
            17*) echo "PostgreSQL 17 confirmed" ;;
            *) echo "REFUSING: expected PostgreSQL 17, got $version" >&2; exit 1 ;;
          esac

      - name: PS-508 frozen tuple round trip
        run: npm run -s test:ps-508-billing-frozen-tuple-pg17

      # Hermes re-audit correction 2: the round trip above proves the DECISION on persisted
      # rows; this proves the REAL generator — generateLineItems against the actual
      # migrations — emits the frozen line, the hold, and the gate-off legacy differential.
      - name: PS-508 real Billing generator emits the frozen line
        run: npm run -s test:ps-508-billing-generates-frozen-line-pg17

      # Hermes re-audit correction 6: the mutation claims as a reproducible exact-SHA
      # artifact. With PS508_PG17_ADMIN_URL present the two generator-layer mutants run too.
      - name: PS-508 mutation manifest (all mutants)
        run: npm run -s test:ps-508-mutation-manifest

      # Round-3 audit: the canary packet cannot be blessed unless its failure paths are
      # proven. Ten cases: server-enforced read-only (a deliberate write fails), zero-row
      # INCOMPLETE, cohort gating, NOT-YET-COMPARED failing, the numeric-string tuple the
      # real Portal SQL rejects, half-cent canonical rounding, once-per-shipment mismatch
      # counting, and the activation identity gates incl. PORTAL-MIRROR-STALE.
      # Round-4 audit: the packet scripts live outside the root typecheck (tsconfig
      # excludes scripts/**) and tsx transpiles without checking — which is how a
      # read-only-breaking TS2322 shipped unseen. This step compiles both under the
      # repository's strict settings including noUncheckedIndexedAccess.
      - name: PS-508 packet scripts pass repo-strict TypeScript
        run: >-
          npx tsc --noEmit --strict --noUncheckedIndexedAccess --noImplicitOverride --skipLibCheck
          --moduleResolution bundler --module esnext --target es2022 --esModuleInterop
          scripts/ps-508-canary-evidence-packet.ts scripts/ps-508-canary-packet-smoke-pg17.ts
          scripts/ps-508-canary-portal-identity.ts scripts/ps-508-canary-worker-identity.ts
          scripts/ps-508-canary-source-binding.ts

      # Round-8: Portal provenance is proven at the OWNER boundary — the smoke calls the
      # exported verifyPortalViaApi/worktreeIdentity directly against an in-process stub, and
      # asserts the packet source reads no env override and gates on a clean worktree. No
      # Portal clone, no token, no network.
      - name: PS-508 canary packet smoke
        run: npm run -s test:ps-508-canary-packet-smoke-pg17
