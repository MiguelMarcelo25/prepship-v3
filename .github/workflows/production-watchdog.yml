name: Production Watchdog

on:
  # 2026-07-29: slowed from every 5 minutes to hourly (via */15 the same day).
  # At */5 this fired ~8,640 times a month and, together with sync-cron, was
  # essentially the entire GitHub Actions spending limit -- which in turn
  # blocked the deploy gate, so a health CHECK was preventing health FIXES from
  # shipping. Hourly is ~720 runs, a 92% cut on this workflow alone.
  #
  # Hourly is safe now because DJ stood up an external uptime monitor on
  # /health/ready the same day. That is the fast first-line alarm; this workflow
  # is the DEEPER hourly check and keeps the two things the uptime monitor
  # cannot see: the Vercel shell, and the authenticated sync-freshness probe.
  # A 200 from /health/ready means the API is alive -- it says nothing about
  # whether sync has stalled, which is a different failure and the one that
  # actually bit us.
  #
  # Do NOT delete this workflow. scripts/ps-431-production-self-healing-guard.ts
  # reads this file and asserts its contents, and that guard is inside the SOT
  # pack gating every deploy -- removing the file fails the gate and blocks all
  # shipping until the guard is updated too.
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: production-watchdog
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4

      - name: Restore watchdog cooldown state
        uses: actions/cache/restore@v4
        with:
          path: outputs/production-watchdog-state.json
          key: production-watchdog-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            production-watchdog-${{ runner.os }}-

      - name: Check production readiness and sync freshness
        run: |
          if [ -z "$WATCHDOG_CRON_SECRET" ]; then
            echo "::error::CRON_SECRET is required for the read-only sync freshness probe."
            exit 1
          fi
          if [ -z "$WATCHDOG_ALERT_WEBHOOK_URL" ]; then
            echo "::error::WATCHDOG_ALERT_WEBHOOK_URL is required for phone-reachable escalation."
            exit 1
          fi
          node scripts/production-watchdog.mjs
        env:
          VERCEL_SHELL_URL: ${{ vars.PRODUCTION_VERCEL_SHELL_URL || 'https://prepshipv4.vercel.app' }}
          RENDER_BASE_URL: ${{ vars.SYNC_API_URL || 'https://prepshipv4-api-l5xc.onrender.com' }}
          WATCHDOG_SYNC_STATUS_URL: ${{ vars.WATCHDOG_SYNC_STATUS_URL }}
          WATCHDOG_CRON_SECRET: ${{ secrets.CRON_SECRET }}
          WATCHDOG_ALERT_WEBHOOK_URL: ${{ secrets.WATCHDOG_ALERT_WEBHOOK_URL }}
          WATCHDOG_STATE_FILE: outputs/production-watchdog-state.json
          WATCHDOG_ALERT_COOLDOWN_MS: '1800000'
          WATCHDOG_ALLOW_RESTARTS: ${{ vars.WATCHDOG_ALLOW_RESTARTS || 'false' }}
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ vars.RENDER_SERVICE_ID }}

      - name: Save watchdog cooldown state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: outputs/production-watchdog-state.json
          key: production-watchdog-${{ runner.os }}-${{ github.run_id }}
