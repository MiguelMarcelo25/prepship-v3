name: Sync ShipStation orders + shipments

on:
  # Safety net for the Render worker. The worker remains the primary 3-minute
  # scheduler, but this direct shipment sync keeps labels backfilled if the
  # pg-boss worker/queue gets wedged and avoids manual deploys as recovery.
  #
  # 2026-07-29: slowed from every 5 minutes to every 30. At */5 this fired
  # ~8,640 times a month and, with the watchdog doing the same, was the whole
  # GitHub Actions spending limit -- while the deploy gate that actually
  # protects production runs perhaps ten times a day. This is a BACKUP for a
  # wedged worker, not the primary scheduler, so catching a wedge within 30
  # minutes is enough. Kept rather than deleted: nothing proved the primary
  # worker covers every case, and losing a recovery path to save a few dollars
  # is the wrong trade.
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'What to sync'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - shipments
          - orders
      since_days:
        description: 'Manual backfill window in days. Leave 0 for normal watermark sync.'
        required: false
        default: '0'
        type: string

concurrency:
  group: sync-cron-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync:
    name: POST Render sync endpoint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Hit Render sync endpoint
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          API_URL: ${{ vars.SYNC_API_URL || 'https://prepshipv4-api-l5xc.onrender.com' }}
          MODE: ${{ github.event_name == 'schedule' && 'shipments' || github.event.inputs.mode || 'all' }}
          SINCE_DAYS: ${{ github.event.inputs.since_days || '0' }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            if [ "${GITHUB_EVENT_NAME:-}" = "schedule" ]; then
              echo "::error::CRON_SECRET GitHub secret is not set - scheduled shipment sync cannot run."
              exit 1
            fi
            echo "::warning::CRON_SECRET GitHub secret is not set - protected sync was skipped."
            exit 0
          fi

          case "$MODE" in
            orders) endpoint="/cron/sync-orders" ;;
            shipments) endpoint="/cron/sync-shipments" ;;
            all|"") endpoint="/cron/sync-all" ;;
            *)
              echo "::error::Invalid mode '$MODE'"
              exit 1
              ;;
          esac

          body="{}"
          if [ "$SINCE_DAYS" != "0" ] && [ -n "$SINCE_DAYS" ]; then
            since_ms=$(node -e "const d=Number(process.env.SINCE_DAYS); if(!Number.isFinite(d)||d<0){process.exit(2)} console.log(Date.now() - d*24*60*60*1000)")
            body="{\"sinceMs\":$since_ms}"
          fi

          echo "POST $API_URL$endpoint"
          echo "mode=$MODE since_days=$SINCE_DAYS"
          set +e
          response=$(curl -s -o /tmp/body -w "%{http_code}" \
            -X POST "$API_URL$endpoint" \
            -H "x-cron-secret: $CRON_SECRET" \
            -H "Content-Type: application/json" \
            --connect-timeout 10 \
            --max-time 600 \
            --retry 1 \
            --retry-delay 10 \
            --retry-all-errors \
            --data "$body")
          curl_exit=$?
          set -e
          response="${response:-000}"
          echo "HTTP $response"
          if [ -f /tmp/body ]; then
            cat /tmp/body
          fi
          echo ""
          if [ "$curl_exit" -ne 0 ]; then
            echo "::error::Sync endpoint curl failed with exit code $curl_exit"
            exit "$curl_exit"
          fi
          if [ "$response" -lt 200 ] || [ "$response" -ge 300 ]; then
            echo "::error::Sync endpoint returned $response"
            exit 1
          fi
