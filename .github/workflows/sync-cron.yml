name: Sync ShipStation orders + shipments

on:
  # Backup safety-net sync. The primary sync lives in-process on the API
  # (src/services/sync-scheduler.ts) and fires every 3 minutes while Render
  # is awake. This workflow catches gaps when Render spins down.
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'What to sync'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - shipments
          - orders
      since_days:
        description: 'Manual backfill window in days. Leave 0 for normal watermark sync.'
        required: false
        default: '0'
        type: string

jobs:
  sync:
    name: POST Render sync endpoint
    runs-on: ubuntu-latest
    steps:
      - name: Hit Render sync endpoint
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          API_URL: ${{ vars.SYNC_API_URL || 'https://prepshipv4-api-l5xc.onrender.com' }}
          MODE: ${{ github.event.inputs.mode || 'all' }}
          SINCE_DAYS: ${{ github.event.inputs.since_days || '0' }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET GitHub secret is not set - add it under Settings -> Secrets and variables -> Actions."
            exit 1
          fi

          case "$MODE" in
            orders) endpoint="/cron/sync-orders" ;;
            shipments) endpoint="/cron/sync-shipments" ;;
            all|"") endpoint="/cron/sync-all" ;;
            *)
              echo "::error::Invalid mode '$MODE'"
              exit 1
              ;;
          esac

          body="{}"
          if [ "$SINCE_DAYS" != "0" ] && [ -n "$SINCE_DAYS" ]; then
            since_ms=$(node -e "const d=Number(process.env.SINCE_DAYS); if(!Number.isFinite(d)||d<0){process.exit(2)} console.log(Date.now() - d*24*60*60*1000)")
            body="{\"sinceMs\":$since_ms}"
          fi

          echo "POST $API_URL$endpoint"
          echo "mode=$MODE since_days=$SINCE_DAYS"
          response=$(curl -s -o /tmp/body -w "%{http_code}" \
            -X POST "$API_URL$endpoint" \
            -H "x-cron-secret: $CRON_SECRET" \
            -H "Content-Type: application/json" \
            --data "$body")
          echo "HTTP $response"
          cat /tmp/body
          echo ""
          if [ "$response" -lt 200 ] || [ "$response" -ge 300 ]; then
            echo "::error::Sync endpoint returned $response"
            exit 1
          fi
