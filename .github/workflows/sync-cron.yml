name: Sync ShipStation orders + shipments

on:
  # Backup safety-net sync. The PRIMARY sync lives in-process on the API
  # (src/services/sync-scheduler.ts) and fires every 3 minutes while Render
  # is awake. This workflow catches the gap when Render's free tier spins
  # down after ~15 min of inactivity. GitHub Actions cron drifts 30–60 min
  # under load, so don't rely on this as the primary source of freshness.
  schedule:
    - cron: '*/5 * * * *'
  # Manual trigger from the Actions tab.
  workflow_dispatch:

jobs:
  sync:
    name: POST /cron/sync-all
    runs-on: ubuntu-latest
    steps:
      - name: Hit Render sync endpoint
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          API_URL: https://prepshipv4-api.onrender.com
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET GitHub secret is not set — add it under Settings → Secrets and variables → Actions."
            exit 1
          fi
          response=$(curl -s -o /tmp/body -w "%{http_code}" \
            -X POST "$API_URL/cron/sync-all" \
            -H "x-cron-secret: $CRON_SECRET" \
            -H "Content-Type: application/json")
          echo "HTTP $response"
          cat /tmp/body
          echo ""
          if [ "$response" -lt 200 ] || [ "$response" -ge 300 ]; then
            echo "::error::Sync endpoint returned $response"
            exit 1
          fi
