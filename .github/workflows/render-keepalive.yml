name: Keep Render API warm

on:
  # Render can spin down when idle. Keep this cheap health ping separate from
  # the heavier sync workflow so the app stays reachable without constantly
  # running ShipStation/database sync work.
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  keepalive:
    name: GET Render health
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping health endpoint
        env:
          API_URL: ${{ vars.SYNC_API_URL || 'https://prepshipv4-api-l5xc.onrender.com' }}
        run: |
          url="${API_URL%/}/health"
          echo "GET $url"

          set +e
          response=$(curl -sS -o /tmp/body -w "%{http_code}" \
            --connect-timeout 10 \
            --max-time 90 \
            --retry 2 \
            --retry-delay 10 \
            --retry-all-errors \
            "$url")
          curl_exit=$?
          set -e

          response="${response:-000}"
          echo "HTTP $response"
          if [ -f /tmp/body ]; then
            cat /tmp/body
          fi
          echo ""

          if [ "$curl_exit" -ne 0 ]; then
            echo "::error::Render health ping failed with exit code $curl_exit"
            exit "$curl_exit"
          fi

          if [ "$response" -lt 200 ] || [ "$response" -ge 300 ]; then
            echo "::error::Render health returned $response"
            exit 1
          fi
