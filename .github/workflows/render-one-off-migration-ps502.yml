# PS-502 — migrations 0096-0101, the replacement schema, as a Render one-off job.
#
# WHY THIS LANE
#
# Production execution belongs to the designated operator lane, not a developer session.
# The Render job runs inside the environment that already holds the production
# DATABASE_URL, so no local credential is needed, none is minted, and none passes through
# a workstation. Same pattern as render-one-off-migration-ps488.yml and -ps501.yml.
#
# WHY A GATE FOR ADDITIVE DDL
#
# 0096 creates three new tables; 0097 adds two nullable columns, a partial unique index and
# a CHECK to billing_line_items — the money table. A partial index or CHECK with the wrong
# predicate would either reject legitimate writes or fail to prevent the duplicate charge
# it exists to prevent, and neither failure is visible from "the statement did not throw".
# So inspect is the default, apply demands the exact token, and the read-back asserts the
# SHAPE: table presence, column NULLABILITY (nullable is correct here — NULL means "not yet
# attributed"), the index, and that the CHECK is VALIDATED rather than left NOT VALID.
#
# ORDER AND ATOMICITY. 0097 references replacements(id), so 0096 must land first. The
# runner applies them in order inside ONE transaction: a failure in 0097 rolls 0096 back
# rather than leaving half a schema.
#
# NOT URGENT, BY DESIGN. Nothing deployed reads these tables yet — PS-502's shipped slice
# is the schema plus a PURE state machine, and the commands that write replacements are
# behind `unlock shipped data` and not built. So the code is safe before or after this runs.
#
# LOCKDOWN. Everything here is on the card's "no unlock" list: additive replacement tables,
# additive billing_line_items / billing_credit_notes columns, and a foreign key REFERENCING
# shipments.id, which mutates nothing. This lane must never be extended to touch shipment,
# order or billing ROWS.
#
# FILES ARE SHIPPED IN, not assumed present: the deployed service runs whatever commit is
# live. The runner refuses to start unless both SQL files match their pinned digests.
name: Render One-Off Migration (PS-502 / 0096-0101)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'inspect = read-only report (default). apply = create the schema.'
        required: true
        default: inspect
        type: choice
        options:
          - inspect
          - apply
      confirm:
        description: 'apply only — type APPLY-PS-502-REPLACEMENT-SCHEMA. Leave blank for inspect.'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: render-one-off-migration-ps-502
  # Never cancel a migration mid-flight.
  cancel-in-progress: false

jobs:
  migrate:
    if: github.repository == 'drprepperusa-org/prepship-v4'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # A blank or wrong token in apply mode stops here, before any Render call.
      - name: Validate mode and confirmation
        env:
          MODE: ${{ inputs.mode }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          expected='APPLY-PS-502-REPLACEMENT-SCHEMA'
          case "$MODE" in
            inspect)
              echo 'Mode: INSPECT — read-only. The runner writes nothing without --apply.'
              ;;
            apply)
              test "${CONFIRM:-}" = "$expected" || {
                echo '::error::apply requires the exact confirmation token. Nothing was dispatched.'
                exit 1
              }
              echo 'Mode: APPLY — confirmation accepted.'
              ;;
            *)
              echo "::error::Unknown mode '${MODE}'."
              exit 1
              ;;
          esac

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install deps
        run: npm ci --ignore-scripts

      # Proves this checkout holds the reviewed SQL before anything is shipped. The runner
      # re-checks inside the job from its own pinned constants; this fails faster, and on
      # the archive that is actually about to travel. LF-normalised, since this repo runs
      # core.autocrlf=true.
      - name: Reviewed-content digests
        run: |
          set -euo pipefail
          node <<'NODE'
          const { createHash } = require('node:crypto');
          const { readFileSync } = require('node:fs');
          const norm = (p) => createHash('sha256')
            .update(readFileSync(p, 'utf8').replace(/\r\n/g, '\n'), 'utf8').digest('hex');
          const checks = [
            ['drizzle/0096_ps502_replacements.sql',
             'bee592ffbb801f37858ec3459fdf00889e2fb5391ce820798e4485c026f6d63a'],
            ['drizzle/0097_ps502_replacement_billing.sql',
             'cfa70218831b0ec1377238610e4df2679da7bba4000af5bb57b4fcdfc97fbd91'],
            ['drizzle/0098_ps502_replacement_financial_restrict.sql',
             '56ea07a48cb95127a335cbf9dd748c1507eba3077a550e0decff17021b9a2d37'],
            ['drizzle/0099_ps502_replacement_request_signature.sql',
             '7a44f912b90c12e94bac255e331af0bd60e2f337ca842255b411949ca37dbdfe'],
            ['drizzle/0100_ps502_replacement_operational_state.sql',
             '6f1524aaba51240650f380fec4af03f29d048cd66d2df1ad0c8003f2d628f9b3'],
            ['drizzle/0101_ps502_replacement_original_order_holds.sql',
             'fbd965fe230f44dbd34da5bf877473cd64f2ec694f71a5ba5f206f71069995a0'],
          ];
          let failed = false;
          for (const [file, expected] of checks) {
            const actual = norm(file);
            if (actual === expected) console.log('ok   ' + file);
            else { console.error('STOP: ' + file + '\n  actual:   ' + actual + '\n  expected: ' + expected); failed = true; }
          }
          process.exit(failed ? 1 : 0);
          NODE

      # The contract these migrations exist to satisfy. If the guard is red, the schema
      # change is not the thing to fix first.
      - name: PS-502 replacement contract guard
        run: npm run test:ps-502-replacement-contract

      - name: Run the PS-502 runner as a Render one-off job
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          if [ -z "${RENDER_API_KEY:-}" ] || [ -z "${RENDER_SERVICE_ID:-}" ]; then
            echo '::error::RENDER_API_KEY and RENDER_SERVICE_ID are required.'
            exit 1
          fi

          # The digest step above verifies 0096-0101. THIS block is what actually reaches the
          # server, and it listed only 0096/0097 — so the runner would have been handed an
          # archive missing four migrations while its own guard demanded six digests. The
          # contract guard could not see the difference because it searched the whole file,
          # and every filename appears in the verification prose above.
          d96='bee592ffbb801f37858ec3459fdf00889e2fb5391ce820798e4485c026f6d63a'
          d97='cfa70218831b0ec1377238610e4df2679da7bba4000af5bb57b4fcdfc97fbd91'
          d98='56ea07a48cb95127a335cbf9dd748c1507eba3077a550e0decff17021b9a2d37'
          d99='7a44f912b90c12e94bac255e331af0bd60e2f337ca842255b411949ca37dbdfe'
          d100='6f1524aaba51240650f380fec4af03f29d048cd66d2df1ad0c8003f2d628f9b3'
          d101='fbd965fe230f44dbd34da5bf877473cd64f2ec694f71a5ba5f206f71069995a0'
          files=(
            scripts/apply-ps-502-replacement-schema.ts
            drizzle/0096_ps502_replacements.sql
            drizzle/0097_ps502_replacement_billing.sql
            drizzle/0098_ps502_replacement_financial_restrict.sql
            drizzle/0099_ps502_replacement_request_signature.sql
            drizzle/0100_ps502_replacement_operational_state.sql
            drizzle/0101_ps502_replacement_original_order_holds.sql
          )
          runner='npx tsx scripts/apply-ps-502-replacement-schema.ts'
          run_args="--digest96=${d96} --digest97=${d97} --digest98=${d98} --digest99=${d99} --digest100=${d100} --digest101=${d101}"
          if [ "$MODE" = 'apply' ]; then
            run_args="${run_args} --apply --confirm=APPLY-PS-502-REPLACEMENT-SCHEMA"
          fi

          archive_b64=$(tar -czf - "${files[@]}" | base64 -w0)
          start_command="printf '%s' '${archive_b64}' | base64 -d | tar -xzf - && ${runner} ${run_args}"
          payload=$(START_COMMAND="$start_command" node -e \
            'process.stdout.write(JSON.stringify({startCommand: process.env.START_COMMAND}))')

          response=$(curl -sS -w $'\n%{http_code}' \
            -X POST "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/jobs" \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H 'Content-Type: application/json' \
            -H 'Accept: application/json' \
            --data "$payload")
          http_code=$(printf '%s' "$response" | tail -n1)
          body=$(printf '%s' "$response" | sed '$d')
          if [ "$http_code" != '201' ]; then
            echo "::error::Render one-off job creation failed (HTTP ${http_code})."
            exit 1
          fi

          job_id=$(BODY="$body" node -e \
            'const body=JSON.parse(process.env.BODY||"{}"); process.stdout.write(String(body.id||""))')
          test -n "$job_id" || { echo '::error::Render returned no job id.'; exit 1; }
          echo "Render ${MODE} job created: ${job_id}"

          for attempt in $(seq 1 90); do
            sleep 10
            job=$(curl -sS \
              "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/jobs/${job_id}" \
              -H "Authorization: Bearer ${RENDER_API_KEY}" \
              -H 'Accept: application/json')
            status=$(BODY="$job" node -e \
              'const body=JSON.parse(process.env.BODY||"{}"); process.stdout.write(String(body.status||""))')
            echo "${MODE} status=${status} (poll ${attempt})"
            case "$status" in
              succeeded)
                if [ "$MODE" = 'apply' ]; then
                  echo 'PS-502 0096-0101 applied and verified. Read the job log for the shape read-back.'
                else
                  echo 'INSPECT complete — nothing was written. Read the job log before dispatching apply.'
                fi
                exit 0 ;;
              failed|canceled)
                echo "::error::Render ${MODE} job ${status}. Read the job log; nothing is assumed."
                exit 1 ;;
            esac
          done
          echo '::error::Timed out waiting for the Render job. Check its status before re-dispatching.'
          exit 1
