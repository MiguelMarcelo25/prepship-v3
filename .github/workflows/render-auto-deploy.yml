name: Render Auto-Deploy (CI-gated)

# Hands-off Render deploy that ONLY runs after the CI gate (SOT guard pack + typecheck +
# PS-421 + frontend build + shipping-roundtrip-certification) passes on prepshipv4-stable.
# This replaces the manual
# "redeploy Render after a push" step WITHOUT removing the safety gate that Render's native
# Auto-Deploy would bypass (native auto-deploy ships every push regardless of CI — unsafe for
# this money/rate/label/insurance backend).
#
# Required GitHub repo secrets (drprepperusa-org/prepship-v4):
#   RENDER_API_KEY          — Render API key (Bearer token)
#   RENDER_SERVICE_ID       — the main API service id (srv-...)
#   RENDER_WORKER_SERVICE_ID — (optional) the worker service id; deployed too when set
# If the secrets are absent the deploy job fails LOUDLY (so a missing setup never looks "green").

on:
  workflow_dispatch:
  push:
    branches: [prepshipv4-stable]
    # Redeploy when BACKEND runtime changes, and let edits to this gate verify themselves.
    # Docs (*.md), unrelated guard scripts, and FE-only changes remain excluded.
    paths:
      - 'src/**'
      - 'drizzle/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - '.github/workflows/render-auto-deploy.yml'

concurrency:
  # Never run two deploys for this branch at once; let an in-flight one finish.
  group: render-auto-deploy-prepshipv4-stable
  cancel-in-progress: false

jobs:
  gate:
    # Only the canonical org repo holds the Render secrets / owns production deploys.
    if: github.repository == 'drprepperusa-org/prepship-v4'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Runs FIRST and fails fast. This gate previously listed typecheck, PS-421,
      # the frontend build and the shipping certification -- but NOT the SOT guard
      # pack, which is where PS-464 (architecture boundaries) and PS-313 (rate
      # source-of-truth) live. ci.yml ran the pack; this workflow kept its own
      # shorter list, so a red PS-464 could and did reach production while the
      # general CI was failing. One list, not two.
      - name: Source-of-truth guard pack (PS-464 architecture, PS-313 rate SOT, +56)
        run: npm run test:sot-guard-pack
      - name: Typecheck
        run: npm run typecheck
      - name: PS-421 method/capability/scope matrix
        run: npm run test:ps-421-method-capability-matrix
      - name: Frontend build
        run: npm run build:web
      - name: Shipping roundtrip certification (offline gate)
        run: npm run test:shipping-roundtrip-certification

      # PS-507 deploy-gate re-add pending.
      #
      # The PS-507 suite BELONGS here, for the same reason the SOT guard pack does: this
      # gate and ci.yml must not keep two different lists, and a schema or persistence
      # regression is exactly what a typecheck and a frontend build cannot see. It was
      # added on 495e1eb6 and backed out in the same hour, because it was wired into the
      # deploy gate before it had ever executed on Linux -- and its first Linux run failed.
      # That inverted the rule stated on hazmat-browser-proof in ci.yml: earn the gate
      # first, widen second.
      #
      # The failure was a harness bug, not a product defect (the query endpoint used
      # postgres.js's UNNAMED prepared statement, which PGlite shares across socket
      # connections, so a concurrent API query clobbered the bind). It is fixed, but a
      # fix that has never been observed green on Linux is not evidence.
      #
      # RE-ADD CRITERION: the ps-507-qa-stack-proofs job in ci.yml green on three
      # consecutive pushes. Then restore the three steps below and delete this comment.
      #
      #   - name: Install Chromium (PS-507 browser leg)
      #     run: npx playwright install --with-deps chromium
      #   - name: PS-507 disposable QA stack proofs (PS-499 Step 12 + PS-488 M3)
      #     run: npm run test:ps-507
      #   - name: Upload PS-507 failure trace
      #     if: failure()
      #     uses: actions/upload-artifact@v4
      #     with:
      #       name: ps-507-deploy-gate-failure
      #       path: test-results/
      #       retention-days: 7

  deploy:
    needs: gate
    if: github.repository == 'drprepperusa-org/prepship-v4'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Trigger + verify Render deploy (API, then worker if configured)
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          RENDER_WORKER_SERVICE_ID: ${{ secrets.RENDER_WORKER_SERVICE_ID }}
        run: |
          set -euo pipefail

          if [ -z "${RENDER_API_KEY:-}" ] || [ -z "${RENDER_SERVICE_ID:-}" ]; then
            echo "::error::RENDER_API_KEY and RENDER_SERVICE_ID must be set as repo secrets before CI-gated deploy can run."
            exit 1
          fi

          json_field() { node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{console.log((JSON.parse(s)||{})[process.argv[1]]??"")}catch{console.log("")}})' "$1"; }

          deploy_service() {
            service_id="$1"; service_name="$2"
            echo "::group::Deploy ${service_name} (${service_id})"

            resp=$(curl -sS -w $'\n%{http_code}' -X POST \
              "https://api.render.com/v1/services/${service_id}/deploys" \
              -H "Authorization: Bearer ${RENDER_API_KEY}" \
              -H "Content-Type: application/json" \
              -H "Accept: application/json" \
              -d '{"clearCache":"do_not_clear"}')
            http_code=$(printf '%s' "$resp" | tail -n1)
            body=$(printf '%s' "$resp" | sed '$d')

            # Render answers 201 with the created deploy, and 202 Accepted when it queues the
            # request instead. Both mean the deploy was accepted. Treating 202 as a failure
            # reported a false red on 0f06b734 while the deploy actually went live — worse
            # than noisy, because a spurious red and a real one then look identical.
            case "$http_code" in
              200|201|202) ;;
              *)
                echo "::error::${service_name}: Render deploy trigger failed (HTTP ${http_code}): ${body}"
                echo "::endgroup::"
                return 1 ;;
            esac

            deploy_id=$(printf '%s' "$body" | json_field id)
            # A 202 body can be empty, leaving no deploy id. Polling ".../deploys/" without one
            # hits the LIST endpoint, whose response has no top-level `status` — the poll would
            # read empty forever and time out on a healthy deploy. Fall back to the service's
            # most recent deploy, which is the one this POST just created.
            if [ -z "$deploy_id" ]; then
              echo "${service_name}: trigger returned HTTP ${http_code} with no deploy id; resolving the latest deploy"
              deploy_id=$(curl -sS \
                "https://api.render.com/v1/services/${service_id}/deploys?limit=1" \
                -H "Authorization: Bearer ${RENDER_API_KEY}" \
                -H "Accept: application/json" \
                | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const j=JSON.parse(s);const first=Array.isArray(j)?j[0]:null;console.log((first&&(first.deploy?.id??first.id))??"")}catch{console.log("")}})')
            fi

            # Never proceed without an id: a blank one polls the wrong endpoint and would fail
            # the deploy on a timeout rather than on the truth.
            if [ -z "$deploy_id" ]; then
              echo "::error::${service_name}: deploy accepted (HTTP ${http_code}) but no deploy id could be resolved; cannot verify it reached live"
              echo "::endgroup::"
              return 1
            fi
            echo "${service_name}: deploy created -> ${deploy_id}"

            # Poll until terminal. Render statuses: live (ok); build_failed/update_failed/
            # pre_deploy_failed/canceled/deactivated (fail); everything else = in progress.
            for i in $(seq 1 90); do
              sleep 10
              s=$(curl -sS \
                "https://api.render.com/v1/services/${service_id}/deploys/${deploy_id}" \
                -H "Authorization: Bearer ${RENDER_API_KEY}" \
                -H "Accept: application/json" | json_field status)
              echo "${service_name}: status=${s} (poll ${i})"
              case "$s" in
                live)
                  echo "${service_name}: deploy is LIVE ✓"; echo "::endgroup::"; return 0 ;;
                build_failed|update_failed|pre_deploy_failed|canceled|deactivated)
                  echo "::error::${service_name}: deploy ended in '${s}'"; echo "::endgroup::"; return 1 ;;
              esac
            done
            echo "::error::${service_name}: deploy did not reach 'live' within the poll window"
            echo "::endgroup::"; return 1
          }

          deploy_service "${RENDER_SERVICE_ID}" "api"

          if [ -n "${RENDER_WORKER_SERVICE_ID:-}" ]; then
            deploy_service "${RENDER_WORKER_SERVICE_ID}" "worker"
          else
            echo "RENDER_WORKER_SERVICE_ID not set — skipping worker deploy (set it to auto-deploy the worker too)."
          fi
