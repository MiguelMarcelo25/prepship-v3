# PS-501 — migration 0095, billing_summary_metrics.return_total, as a Render one-off job.
#
# WHY THIS LANE
#
# Production execution belongs to the designated operator lane, not a developer session.
# The Render job runs inside the environment that already holds the production
# DATABASE_URL, so no local credential is needed, none is minted, and none passes through
# a workstation. Same pattern as render-one-off-migration-ps488.yml.
#
# WHY A GATE FOR AN ADDITIVE COLUMN
#
# 0095 is `add column if not exists return_total numeric(14,2) not null default 0` —
# additive and idempotent. But billing_summary_metrics is a MONEY read model: it is the
# cached answer behind the Billing dashboard. A column added nullable, or at the wrong
# scale, would push "unknown" or a rounding error into money arithmetic. So inspect is the
# default, apply demands the exact token, and the read-back asserts the column's TYPE,
# NULLABILITY and DEFAULT rather than merely its presence.
#
# DEPLOY ORDER DOES NOT MATTER, BY DESIGN. The application code probes for this column
# (billingMetricsHasReturnTotalColumn) and treats its absence as a cache miss, falling back
# to the live query. So shipping the code before this migration degrades performance, never
# correctness — and this lane can be run before or after the deploy.
#
# FILES ARE SHIPPED IN, not assumed present: the deployed service runs whatever commit is
# live, which may not contain 0095. The archive carries the reviewed SQL and the runner,
# and the runner refuses to start unless the SQL matches its pinned digest.
name: Render One-Off Migration (PS-501 / 0095)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'inspect = read-only report (default). apply = commit the column.'
        required: true
        default: inspect
        type: choice
        options:
          - inspect
          - apply
      confirm:
        description: 'apply only — type APPLY-PS-501-0095-BILLING-SUMMARY-RETURN-TOTAL. Leave blank for inspect.'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: render-one-off-migration-ps-501
  # Never cancel a migration mid-flight.
  cancel-in-progress: false

jobs:
  migrate:
    if: github.repository == 'drprepperusa-org/prepship-v4'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # A blank or wrong token in apply mode stops here, before any Render call.
      # Inspect ignores the token entirely — it has no path that writes.
      - name: Validate mode and confirmation
        env:
          MODE: ${{ inputs.mode }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          expected='APPLY-PS-501-0095-BILLING-SUMMARY-RETURN-TOTAL'
          case "$MODE" in
            inspect)
              echo 'Mode: INSPECT — read-only. The runner writes nothing without --apply.'
              ;;
            apply)
              test "${CONFIRM:-}" = "$expected" || {
                echo '::error::apply requires the exact confirmation token. Nothing was dispatched.'
                exit 1
              }
              echo 'Mode: APPLY — confirmation accepted.'
              ;;
            *)
              echo "::error::Unknown mode '${MODE}'."
              exit 1
              ;;
          esac

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install deps
        run: npm ci --ignore-scripts

      # Proves this checkout holds the reviewed SQL before anything is shipped. The runner
      # re-checks inside the job from its own pinned constant; this fails faster, and on the
      # archive that is actually about to travel.
      #
      # LF-normalised: this repo runs core.autocrlf=true, so hashing raw bytes would make
      # the digest depend on the checkout.
      - name: Reviewed-content digest
        run: |
          set -euo pipefail
          node <<'NODE'
          const { createHash } = require('node:crypto');
          const { readFileSync } = require('node:fs');
          const file = 'drizzle/0095_ps501_billing_summary_metrics_return_total.sql';
          const expected = 'a3428b6fd373869d0659569053914e1dd43c25f89e448324fb36890da6827d46';
          const actual = createHash('sha256')
            .update(readFileSync(file, 'utf8').replace(/\r\n/g, '\n'), 'utf8').digest('hex');
          if (actual !== expected) {
            console.error('STOP: ' + file + '\n  actual:   ' + actual + '\n  expected: ' + expected);
            process.exit(1);
          }
          console.log('ok   ' + file);
          NODE

      # The contract this migration exists to satisfy. If the guard is red, the schema
      # change is not the thing to fix first.
      - name: PS-501 canonical billing total guard
        run: npm run test:ps-501-canonical-billing-total

      - name: Run the PS-501 runner as a Render one-off job
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          if [ -z "${RENDER_API_KEY:-}" ] || [ -z "${RENDER_SERVICE_ID:-}" ]; then
            echo '::error::RENDER_API_KEY and RENDER_SERVICE_ID are required.'
            exit 1
          fi

          digest='a3428b6fd373869d0659569053914e1dd43c25f89e448324fb36890da6827d46'
          files=(
            scripts/apply-ps-501-billing-summary-return-total.ts
            drizzle/0095_ps501_billing_summary_metrics_return_total.sql
          )
          runner='npx tsx scripts/apply-ps-501-billing-summary-return-total.ts'
          if [ "$MODE" = 'apply' ]; then
            confirm='APPLY-PS-501-0095-BILLING-SUMMARY-RETURN-TOTAL'
            run_args="--digest=${digest} --apply --confirm=${confirm}"
          else
            run_args="--digest=${digest}"
          fi

          archive_b64=$(tar -czf - "${files[@]}" | base64 -w0)
          start_command="printf '%s' '${archive_b64}' | base64 -d | tar -xzf - && ${runner} ${run_args}"
          payload=$(START_COMMAND="$start_command" node -e \
            'process.stdout.write(JSON.stringify({startCommand: process.env.START_COMMAND}))')

          response=$(curl -sS -w $'\n%{http_code}' \
            -X POST "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/jobs" \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H 'Content-Type: application/json' \
            -H 'Accept: application/json' \
            --data "$payload")
          http_code=$(printf '%s' "$response" | tail -n1)
          body=$(printf '%s' "$response" | sed '$d')
          if [ "$http_code" != '201' ]; then
            echo "::error::Render one-off job creation failed (HTTP ${http_code})."
            exit 1
          fi

          job_id=$(BODY="$body" node -e \
            'const body=JSON.parse(process.env.BODY||"{}"); process.stdout.write(String(body.id||""))')
          test -n "$job_id" || { echo '::error::Render returned no job id.'; exit 1; }
          echo "Render ${MODE} job created: ${job_id}"

          for attempt in $(seq 1 90); do
            sleep 10
            job=$(curl -sS \
              "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/jobs/${job_id}" \
              -H "Authorization: Bearer ${RENDER_API_KEY}" \
              -H 'Accept: application/json')
            status=$(BODY="$job" node -e \
              'const body=JSON.parse(process.env.BODY||"{}"); process.stdout.write(String(body.status||""))')
            echo "${MODE} status=${status} (poll ${attempt})"
            case "$status" in
              succeeded)
                if [ "$MODE" = 'apply' ]; then
                  echo 'PS-501 0095 applied and verified. Read the job log for the column shape.'
                else
                  echo 'INSPECT complete — nothing was written. Read the job log before dispatching apply.'
                fi
                exit 0 ;;
              failed|canceled)
                echo "::error::Render ${MODE} job ${status}. Read the job log; nothing is assumed."
                exit 1 ;;
            esac
          done
          echo '::error::Timed out waiting for the Render job. Check its status before re-dispatching.'
          exit 1
