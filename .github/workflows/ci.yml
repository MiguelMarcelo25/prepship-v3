name: CI

on:
  push:
    branches:
      - prepshipv4-stable
      - 'parity/**'
  pull_request:
    branches:
      - prepshipv4-stable

# Supersede in-flight PR runs only. A push to prepshipv4-stable must always run to
# completion: render-auto-deploy.yml does not wait on this workflow, it re-runs its own
# gate list against the same commit, and a cancelled CI run leaves that commit with no CI
# verdict at all -- which reads as "never checked", not as "superseded".
#
# Deliberately NOT paths-ignore'd. A docs-only push looks free to skip, but the SOT guard
# pack asserts the CONTENTS of AGENTS.md, CLAUDE.md, .cursorrules, ARCHITECTURE.md,
# CONTRIBUTING.md, docs/engineering/** and docs/ps-tickets/** -- ~140 of the repo's 303
# markdown files are read by a guard. Editing one of them genuinely can turn the gate red,
# so skipping CI on markdown would hide exactly the failure the pack exists to catch.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Typecheck + Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install deps
        run: npm ci

      - name: Exact-SHA Final Review closure packets (PS-429)
        env:
          FINAL_REVIEW_CHANGED_SINCE: ${{ github.event.pull_request.base.sha || github.event.before }}
          FINAL_REVIEW_TARGET_BRANCH: ${{ github.event.pull_request.base.ref || github.ref_name }}
        run: npm run test:final-review-closure

      - name: Architecture / SOT / backend-truth guard pack (PS-464 / PS-335)
        run: npm run test:sot-guard-pack

      - name: PS-508 outbound customer-money freeze guard
        run: npm run test:ps-508-outbound-freeze

      - name: PS-508 outbound freeze behavioural fixtures
        run: npm run test:ps-508-outbound-freeze-integration

      - name: PS-508 snapshot classification guard
        run: npm run test:ps-508-classification

      - name: ShipStation batched rate fan-out guard
        run: npm run test:shipstation-batched-rate-fanout

      - name: ShipStation live-probe comparison contract
        run: npm run test:probe-batched-rate-estimate

      - name: Typecheck (backend + frontend)
        run: npm run typecheck

      - name: Frontend build
        run: npm run build:web

  # PS-481 / PS-477: the hazmat disclosure browser proof existed as
  # test:ps-465-hazmat:browser but nothing ran it, so "does it pass?" depended on
  # whose machine you asked -- and a review that saw it red bounced five cards
  # (PS-477/478/479/481/482) on a result nobody could arbitrate. A gated spec has
  # one authoritative run URL instead.
  #
  # Deliberately scoped to this ONE spec, not the whole e2e suite: the suite has
  # known flappers, and a flaky required check would block deploys on noise. Widen
  # only per-spec, once a spec has earned it.
  #
  # Fully mocked -- page.route intercepts every request and the Supabase key is a
  # dummy. No network, no provider, no postage.
  #
  # ---------------------------------------------------------------------------------
  #
  # PS-507: the disposable QA stack and its consumers, run as the second step of this
  # same job.
  #
  # This WIDENS the per-spec rule stated for the hazmat proof above, and the reason it
  # is allowed to is that PS-507 is not part of that flappy suite. It has its own
  # playwright.ps507.config.js (testMatch /ps-507-.*\.spec\.js/, workers: 1, no webServer,
  # no globalSetup) and provisions its own stack, so it shares no fixture, port or server
  # with the legacy e2e run. Measured before wiring: 8 consecutive clean full-suite runs
  # (5 + 3) at ~8s. The one flake ever observed was root-caused, not retried -- the query
  # endpoint was calling pg.query() in-process and interleaving with socket-served queries.
  #
  # What this suite is worth: before it, the only thing standing behind the harness in CI
  # was test:ps-507-qa-harness, a STATIC guard that reads the source. A static guard cannot
  # notice that the stack stopped provisioning, that a migration broke the QA schema, or
  # that the persistence proof went vacuous -- exactly the failures this suite exists to
  # catch. If it turns out to flap, root-cause it or remove the step; do not add retries,
  # because this stack's failure mode lands on whatever request was in flight rather than
  # on the cause, and a retry converts a visible fault into a silent one.
  #
  # This suite alone is NOT a deploy gate. Despite its name, "Render Auto-Deploy (CI-gated)"
  # does not wait on this workflow's conclusion -- it re-runs its own inline gate list.
  # That workflow's own comment records why the lists must not diverge: the SOT pack was
  # copied into it after "a red PS-464 could and did reach production while the general CI
  # was failing". So the PS-507 suite is registered in BOTH, and the two must be changed
  # together. The deploy-gate copy lives in render-auto-deploy.yml.
  #
  # Needs NO secrets. The database is in-memory PGlite behind a loopback socket, the
  # bearer is signed with a per-run random secret, and the Supabase URL is a syntactically
  # valid ref that never resolves. Nothing reaches a carrier, marketplace or mailbox.
  #
  # 2026-08-16: was a separate `ps-507-qa-stack-proofs` job. Folded in here purely for
  # billing -- both jobs paid their own `npm ci` and `playwright install chromium`, and
  # GitHub bills each job separately with the duration rounded UP to the whole minute.
  # One shared setup instead of two. Both proofs still run and report independently;
  # see the `!cancelled()` note on the PS-507 step.
  browser-proofs:
    name: Browser proofs (hazmat disclosure + PS-507 QA stack)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install deps
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Hazmat disclosure browser proof
        run: npm run test:ps-465-hazmat:browser

      # Seeds BOTH fixtures and runs all 13 specs: the persistence proof, the PS-499
      # Step 12 API and browser legs, and the PS-488 M3 return-identity proofs.
      #
      # `!cancelled()` so a red hazmat proof does NOT hide the PS-507 result. When these
      # were two jobs they reported independently, and losing that would mean learning
      # about one failure per run -- the opposite of what the notes above ask for. Both
      # proofs still report; only the setup is shared.
      - name: PS-507 persistence, authorisation and identity proofs
        if: ${{ !cancelled() }}
        run: npm run test:ps-507

      - name: Upload failure trace
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-proofs-failure
          path: test-results/
          retention-days: 7


  # PS-520. The customer invoice query, executed — HTML + XLSX + CSV — against real PostgreSQL.
  #
  # PS-513 broke billingInvoiceData's SQL and all three invoice routes failed for every client for
  # ~6 hours while CI stayed green, because nothing in the suite ran the query: typecheck cannot
  # see inside a sql`` template, the invoice guards feed the RENDERERS a fixture DTO, and ps-433
  # exercises a different owner. This job is the lane that would have caught it.
  invoice-routes-pg17:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ps520
          POSTGRES_PASSWORD: ps520
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ps520"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      # Loopback service container only; no production database is reachable from this job.
      PS520_PG17_ADMIN_URL: postgres://ps520:ps520@127.0.0.1:5432/postgres
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_ANON_KEY: offline-dummy
      SUPABASE_SERVICE_ROLE_KEY: offline-dummy
      SUPABASE_JWT_SECRET: offline-dummy

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Confirm PostgreSQL 17 is the server under test
        run: |
          node -e "const p=require('postgres');const s=p(process.env.PS520_PG17_ADMIN_URL,{max:1});s\`select current_setting('server_version_num')::int as v\`.then(r=>{const v=r[0].v;if(v<170000||v>=180000){console.error('not PG17: '+v);process.exit(1)}console.log('server_version_num='+v);return s.end()}).catch(e=>{console.error(e);process.exit(1)})"
      - name: PS-520 invoice routes execute against real PostgreSQL (HTML + XLSX + CSV)
        run: npm run -s test:ps-520-invoice-routes-pg17
